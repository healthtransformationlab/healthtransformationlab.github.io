<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perio DQ Monitor · Health Transformation Lab</title>
<meta name="description" content="Is this dental record fit for finding gum disease? Completeness, accuracy, consistency, temporal plausibility and reliability, on synthetic records.">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0F2A33">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout concept: a monitoring console — one filter rail, five domain tiles, then one panel per
     framework sub-domain (Zozus completeness/accuracy/consistency + Kahn temporal plausibility + de Vet reliability),
     each panel labeled with the framework rung it satisfies. Scanned, not read. */
  :root {
    --page: #f9f9f7;          /* page plane */
    --surface: #fcfcfb;       /* chart surface / panel */
    --surface-2: #f2f1ed;     /* muted wells */
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --hair: #e1e0d9;
    --baseline: #c3c2b7;
    --ring: rgba(11,11,11,0.10);
    --accent: #2a78d6;        /* series-1 blue */
    --accent-ink: #1c5cab;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;
    --good: #0ca30c; --good-ink: #006300;
    --warn: #fab219; --warn-ink: #7a5200;
    --crit: #d03b3b; --crit-ink: #a12727;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
      --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
      --hair: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-ink: #86b6ef;
      --series-2: #d95926; --series-3: #199e70;
      --seq-100: #104281; --seq-200: #1c5cab; --seq-300: #256abf; --seq-400: #2a78d6; --seq-500: #3987e5; --seq-600: #6da7ec; --seq-700: #9ec5f4;
      --good-ink: #3fc23f; --warn-ink: #fab219; --crit-ink: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --hair: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-ink: #86b6ef;
    --series-2: #d95926; --series-3: #199e70;
    --seq-100: #104281; --seq-200: #1c5cab; --seq-300: #256abf; --seq-400: #2a78d6; --seq-500: #3987e5; --seq-600: #6da7ec; --seq-700: #9ec5f4;
    --good-ink: #3fc23f; --warn-ink: #fab219; --crit-ink: #e66767;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  button { font: inherit; color: inherit; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* top bar */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
  .top h1 { font-size: 22px; letter-spacing: -0.01em; }
  .top .sub { color: var(--ink-2); margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--hair); border-radius: 999px; font-size: 12px; color: var(--ink-2); background: var(--surface); font-family: var(--font-mono); }
  .chip.sample { border-color: var(--warn); color: var(--warn-ink); background: transparent; font-family: var(--font-ui); font-weight: 500; }

  /* filter rail */
  .rail { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 14px; }
  .tabs { display: inline-flex; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .tabs button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 500; color: var(--ink-2); border-right: 1px solid var(--hair); }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .tabs.edr button[aria-selected="true"] { background: var(--ink); color: var(--page); }
  table.sources tbody tr { cursor: pointer; }
  table.sources tbody tr:hover { background: var(--surface-2); }
  table.sources tbody tr.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  table.sources tbody tr.sel td.k { color: var(--accent-ink); }
  table.sources tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.sources code { font-family: var(--font-mono); font-size: 12px; }
  .field select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--hair); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .scope { display: inline-flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .scope button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .scope button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 500; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-block: 6px 20px; }
  .tile { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; min-width: 0; border-top: 3px solid var(--tile-stripe, var(--baseline)); }
  .tile .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 500; }
  .tile .domain { font-weight: 600; margin-top: 2px; }
  .tile .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.1; }
  .tile .value small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
  .tile .def { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.good { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .pill.warn { color: var(--warn-ink); background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .pill.crit { color: var(--crit-ink); background: color-mix(in srgb, var(--crit) 14%, transparent); }
  .pill.crit::before { border-radius: 1px; transform: rotate(45deg); }
  .pill.warn::before { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .tile.good { --tile-stripe: var(--good); } .tile.warn { --tile-stripe: var(--warn); } .tile.crit { --tile-stripe: var(--crit); }

  /* panels */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .panel { grid-column: span 6; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .panel.w4 { grid-column: span 4; } .panel.w8 { grid-column: span 8; } .panel.w12 { grid-column: span 12; }
  .phead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .phead .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-ink); font-weight: 600; }
  .phead h2 { font-size: 15px; margin-top: 2px; }
  .phead .rung { font-size: 11px; font-family: var(--font-mono); color: var(--ink-3); white-space: nowrap; border: 1px solid var(--hair); border-radius: 4px; padding: 2px 6px; }
  .note { color: var(--ink-2); font-size: 12.5px; margin: 0; max-width: 62ch; }
  .section-h { grid-column: span 12; display: flex; align-items: baseline; gap: 12px; margin-top: 8px; }
  .section-h h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
  .section-h .line { flex: 1; height: 1px; background: var(--hair); }
  .section-h .src { font-size: 12px; color: var(--ink-3); }

  /* charts */
  .chart { position: relative; }
  svg { display: block; max-width: 100%; height: auto; overflow: visible; }
  .axis-text { font-size: 11px; fill: var(--ink-3); font-family: var(--font-ui); }
  .lbl { font-size: 12px; fill: var(--ink-2); font-family: var(--font-ui); }
  .val { font-size: 12px; fill: var(--ink); font-family: var(--font-mono); font-weight: 500; }
  .grid-line { stroke: var(--hair); stroke-width: 1; }
  .base { stroke: var(--baseline); stroke-width: 1; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 6px; padding: 0; vertical-align: middle; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent-ink); font: italic 700 11px/1 Georgia, "Times New Roman", serif; cursor: pointer; position: relative; flex: none; text-transform: none; letter-spacing: 0; }
  .info::after { content: ""; position: absolute; inset: -10px; }  /* a 38 px target for fingers */
  .info:hover, .info[aria-expanded="true"] { background: var(--accent); color: #fff; }
  .info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pop { position: fixed; z-index: 50; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--hair); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.18); padding: 12px 34px 12px 14px; font: 400 13px/1.5 var(--font-ui); text-align: left; }
  .pop b { display: block; font-weight: 600; margin-bottom: 4px; }
  .pop p { margin: 0 0 6px; }
  .pop .cite { display: block; color: var(--ink-3); font-size: 12px; margin-top: 6px; }
  .pop .cite a { color: var(--accent-ink); }
  .pop .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border: 0; background: transparent; color: var(--ink-3); font-size: 18px; cursor: pointer; border-radius: 6px; }
  .pop .x:hover { background: var(--surface-2); }
  @media (max-width: 640px) { .pop { left: 16px !important; right: 16px !important; top: auto !important; bottom: 16px !important; width: auto; } }
  .clinics { display: flex; align-items: center; gap: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px; }
  .clinics::-webkit-scrollbar { display: none; }
  .clinics .lbl { font-size: 13px; color: var(--ink-2); margin-right: 2px; flex: none; }
  .clinics button { flex: none; min-width: 36px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--hair); background: var(--surface); color: var(--ink-2); font: 500 13px var(--font-ui); cursor: pointer; }
  .clinics button:hover { border-color: var(--accent); color: var(--ink); }
  .clinics button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .clinics button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .clinics { width: 100%; flex-wrap: wrap; overflow: visible; } .clinics .lbl { width: 100%; } .clinics button { min-width: 40px; padding: 0 10px; } .rail { gap: 10px; } }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); z-index: 5; font-family: var(--font-mono); }
  .tip b { font-family: var(--font-ui); font-weight: 600; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.k { font-weight: 500; }
  .twrap { overflow-x: auto; }

  /* heat matrix */
  .matrix { display: grid; gap: 3px; font-size: 12px; }
  .matrix .h { color: var(--ink-3); font-size: 11px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px; }
  .matrix .rh { color: var(--ink-2); display: flex; align-items: center; padding-right: 6px; }
  .matrix .c { display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 4px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; position: relative; }
  .matrix .c.diag { background: var(--surface-2); color: var(--ink-3); }
  .matrix .c.flag { box-shadow: inset 0 0 0 2px var(--crit); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
  .ramp { display: inline-flex; gap: 1px; vertical-align: -2px; margin: 0 5px; }
  .ramp i { width: 10px; height: 10px; display: block; }

  /* cascade */
  .cascade { display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--hair); border-radius: 8px; background: var(--surface-2); }
  .step .n { font-family: var(--font-mono); color: var(--ink-3); font-size: 12px; }
  .step .t { font-weight: 500; }
  .step .d { color: var(--ink-2); font-size: 12px; }
  .step .acc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .step.reorder { border-color: var(--warn); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .foot { color: var(--ink-3); font-size: 12px; margin-top: 22px; max-width: 80ch; }

  @media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .panel, .panel.w4, .panel.w8 { grid-column: span 12; } }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } .tile .value { font-size: 24px; } .step { grid-template-columns: 24px 1fr; } .step .acc, .step .pill { justify-self: start; } }
  @media (prefers-reduced-motion: no-preference) { .tabs button, .scope button { transition: background .15s; } }
</style>
<style>
  .home { display:inline-flex; align-items:center; gap:8px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; margin-bottom:12px;
    padding:8px 14px 8px 10px; border:1px solid var(--hair); border-radius:999px; background:var(--surface); }
  .home:hover { border-color: var(--accent); color: var(--accent-ink); }
  .home b { display:grid; place-items:center; width:22px; height:22px; border-radius:6px; background:#F2A070; color:#0F2A33; font-size:12px; }
  a { color: var(--accent-ink); }
  .hb { display:grid; grid-template-columns: minmax(140px, 36%) 1fr; gap: 2px 12px; align-items:center; font-size:13px; padding:3px 0; }
  .hb .lab { color: var(--ink-2); text-align:right; }
  .hb .trk { position:relative; height:18px; border-left:1px solid var(--baseline); margin-right:64px; }
  .hb .bar { height:14px; margin-top:2px; border-radius:0 4px 4px 0; min-width:1px; }
  .hb .v { position:absolute; top:0; padding-left:6px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink); white-space:nowrap; }
  .hb .ci { position:absolute; top:8px; height:2px; background:var(--ink); }
  .hb .ci::before,.hb .ci::after { content:""; position:absolute; top:-4px; width:2px; height:10px; background:var(--ink); }
  .hb .ci::before { left:0 } .hb .ci::after { right:0 }
  .hb .ov { position:absolute; top:-3px; bottom:-3px; width:0; border-left:2px dashed var(--ink); }
  .hb.sel .lab { color: var(--ink); font-weight:600; }
  .hb:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .axis { display:grid; grid-template-columns: minmax(140px, 36%) 1fr; gap:12px; font-size:11px; color:var(--ink-3); }
  .axis div:last-child { display:flex; justify-content:space-between; margin-right:64px; }
  @media (max-width: 640px) {
    .hb, .axis { grid-template-columns: 1fr; }
    .hb .lab { text-align:left; padding-top:4px; }
    .axis div:first-child { display:none; }
  }
  .loading { padding: 40px 0; color: var(--ink-2); }
  .matrix .c.sel, .clinic-sel { outline: 2px solid var(--ink); }
</style>
</head>
<body>
<div id="root" class="wrap"><p class="loading">Loading the data…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const SRC = "https://raw.githubusercontent.com/healthtransformationlab/health-transformation-lab-nlp/main/docs/site/data-quality.json";
const CODE = "https://github.com/healthtransformationlab/health-transformation-lab-nlp/blob/main/python/health_transformation_lab_nlp/dq_site.py";
const SCOPES = [{ id:"all_visits", label:"All visits" }, { id:"complete_cases", label:"Complete cases" }, { id:"reference_set", label:"Reference set (240)" }];
// starting-point targets, to agree with the research team
const STATUS_LABEL = { good:"Within target", warn:"Watch", crit:"Needs attention", none:"Not assessed" };
const band = (v, good, warn, higherBetter) => v == null ? "none" : higherBetter ? (v >= good ? "good" : v >= warn ? "warn" : "crit") : (v <= good ? "good" : v <= warn ? "warn" : "crit");
const fmt = (n, d=1) => n == null ? "—" : n.toLocaleString("en-US", { maximumFractionDigits:d, minimumFractionDigits: Number.isInteger(n) ? 0 : d });
const seq = t => `var(${["--seq-100","--seq-200","--seq-300","--seq-400","--seq-500","--seq-600","--seq-700"][Math.min(6, Math.max(0, Math.round(t*6)))]})`;

// Plain-language meanings for the page's terms, opened from the ⓘ buttons
const KAHN = <a href="https://doi.org/10.13063/2327-9214.1244" target="_blank" rel="noopener">Kahn et al., eGEMs 2016</a>;
const ZOZUS = <>Zozus MN, Hammond WE, Green BB, et al. <i>Assessing Data Quality for Healthcare Systems Data Used in Clinical Research</i>. NIH Health Care Systems Research Collaboratory, 2014 (<a href="https://rethinkingclinicaltrials.org/" target="_blank" rel="noopener">Living Textbook</a>)</>;
const GLOSS = {
  framework: { t: "NIH pragmatic-trials framework", d: <>A guide from the NIH Health Care Systems Research Collaboratory on whether data collected during everyday care is good enough for research. It checks three things: is the data there (completeness), is it right (accuracy), and is it recorded the same way everywhere (consistency).</>, c: ZOZUS },
  zozus: { t: "Zozus", d: <>The surname of the first author, Meredith Zozus, of the NIH guide this page follows. Tiles marked “Zozus” are its three checks: completeness, accuracy and consistency.</>, c: ZOZUS },
  kahn: { t: "Kahn", d: <>Michael Kahn led a group that agreed shared names for data-quality checks on health records. One of their checks is used here: <b style={{display:"inline"}}>temporal plausibility</b>, whether a record changes over time in a way that could really happen.</>, c: KAHN },
  devet: { t: "de Vet", d: <>Henrica de Vet and colleagues set out the difference between two ideas. <b style={{display:"inline"}}>Agreement:</b> how close two readings of the same thing are. <b style={{display:"inline"}}>Reliability:</b> whether, despite that difference, the readings can still tell people apart. This page uses reliability for whether independent reviewers reach the same answer on the same record.</>, c: <>de Vet HCW, Terwee CB, Knol DL, Bouter LM. J Clin Epidemiol 2006;59(10):1033–1039 (<a href="https://doi.org/10.1016/j.jclinepi.2005.10.015" target="_blank" rel="noopener">doi</a>)</> },
  completeness: { t: "Completeness", d: <>Is the information there? Here: the share of visits that have all three of an exam form, a diagnosis code and a gum chart.</> },
  accuracy: { t: "Accuracy", d: <>Is the information right? Here: how often the record's answer matches the true status. On this synthetic data the truth is known because the generator made it; real records would need reviewers.</> },
  consistency: { t: "Consistency", d: <>Is it recorded the same way everywhere? Here: how far apart the clinics are on the share of patients with gum disease. A big gap can mean different patients, different habits or different charting, so it's a prompt to look, not proof of an error.</> },
  temporal: { t: "Temporal plausibility", d: <>Does the record change over time in a believable way? Gum disease doesn't heal by itself: without treatment, a stage should stay the same or get worse. A later visit with a better stage and no treatment between is flagged as implausible.</>, c: KAHN },
  reliability: { t: "Reliability", d: <>Would two reviewers reading the same record give the same answer? It needs real people staging the same records, so it isn't measured yet.</> },
  scope: { t: "Levels of scale", d: <><b style={{display:"inline"}}>All visits:</b> every synthetic visit. <b style={{display:"inline"}}>Complete cases:</b> only visits where every source is present. <b style={{display:"inline"}}>Reference set:</b> the 240 held-out review charts every method is scored on. The same number can look better or worse depending on which visits it counts.</> },
  funnel: { t: "Complete-case funnel", d: <>Start with every visit, then keep only those that also have the next source. The last bar is how many visits have everything, so every source can be compared on them.</> },
  rung1: { t: "Accuracy hierarchy, rung 1", d: <>The NIH guide ranks ways to check accuracy. The strongest is comparing with a known true answer. Synthetic data has one; real data would need expert reviewers.</>, c: ZOZUS },
  rung2: { t: "Accuracy hierarchy, rung 2", d: <>The next-best check when no true answer exists: compare two independent parts of the record that should say the same thing, like the gum chart and the diagnosis code. Low agreement means at least one of them is often off.</>, c: ZOZUS },
  agree: { t: "Agree, Sens, Spec, PPV, NPV", d: <><b style={{display:"inline"}}>Agree:</b> same status as the truth. The other four treat it as yes/no, gum disease or not. <b style={{display:"inline"}}>Sens</b>itivity: of people who have it, the share the source catches. <b style={{display:"inline"}}>Spec</b>ificity: of people who don't, the share it correctly leaves out. <b style={{display:"inline"}}>PPV</b>: when it says yes, how often that's right. <b style={{display:"inline"}}>NPV</b>: when it says no, how often that's right.</> },
  concordance: { t: "Concordance", d: <>How often two sources give the same status for the same visit, without looking at the truth. Darker means they agree more.</> },
  groups: { t: "Kept as well for every group?", d: <>The study lead reads consistency as bias: is the record kept as well for every group of patients? For each office, provider, sex, race, exam year and age band, this shows the share of its perio charts with no gum-margin readings (so no attachment loss), or incomplete in any way. A group is flagged ▲ when it sits more than 2 SD from the other groups of its type and at least 5 points away; groups under 30 charts are shown but never flagged. The groups are provisional until the study lead names his.</>, c: <>After Kookal et al., J Public Health Dent 2024 (<a href="https://doi.org/10.1111/jphd.12618" target="_blank" rel="noopener">doi</a>), who compared offices with the mean of all offices</> },
  checks: { t: "Extract checks", d: <>The checks Kookal et al. ran on a dental record extract, adapted to Open Dental's tables: is every column there, are values in range and in the right code lists, are keys and rows duplicated, and do plan copies still match their procedure. Each reports what it found; nothing is fixed. On this synthetic extract they find only what the generator puts in on purpose.</>, c: <>Kookal et al., J Public Health Dent 2024 (<a href="https://doi.org/10.1111/jphd.12618" target="_blank" rel="noopener">doi</a>)</> },
  impact: { t: "Impact assessment", d: <>Do the data problems change the answer? Here: the study design reads the sources in a fixed order. If a later source is more accurate than an earlier one, the order may be costing accuracy.</> },
  messiness: { t: "Chart messiness", d: <>How often a perio chart is partial, has unread teeth or is charted somewhere else, counted on the synthetic Open Dental extract the way they would be on a real one.</> },
};

function Info({ k }) {
  const g = GLOSS[k];
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!pos) return;
    const close = e => { if (e.type === "keydown" ? e.key === "Escape" : !e.target.closest(".pop")) setPos(null); };
    const others = e => { if (e.detail !== k) setPos(null); };
    document.addEventListener("click", close); document.addEventListener("keydown", close);
    window.addEventListener("scroll", close, { passive: true }); document.addEventListener("info-open", others);
    return () => { document.removeEventListener("click", close); document.removeEventListener("keydown", close);
      window.removeEventListener("scroll", close); document.removeEventListener("info-open", others); };
  }, [pos]);
  const toggle = e => {
    e.stopPropagation();
    if (pos) return setPos(null);
    const r = e.currentTarget.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 32);
    const below = r.bottom + 8 + 220 < window.innerHeight;
    document.dispatchEvent(new CustomEvent("info-open", { detail: k }));
    setPos({ left: Math.max(16, Math.min(r.left - w / 2 + r.width / 2, window.innerWidth - w - 16)),
             top: below ? r.bottom + 8 : null, bottom: below ? null : window.innerHeight - r.top + 8 });
  };
  return (<>
    <button type="button" className="info" aria-label={`What does “${g.t}” mean?`} aria-expanded={!!pos} onClick={toggle}>i</button>
    {pos && ReactDOM.createPortal(
      <div className="pop" role="dialog" aria-label={g.t} onClick={e => e.stopPropagation()}
           style={{ left: pos.left, top: pos.top ?? "auto", bottom: pos.bottom ?? "auto" }}>
        <button type="button" className="x" aria-label="Close" onClick={() => setPos(null)}>×</button>
        <b>{g.t}</b><p>{g.d}</p>{g.c && <span className="cite">Source: {g.c}</span>}</div>, document.body)}
  </>);
}

function useTip() {
  const [tip, setTip] = useState(null);
  const show = (e, content) => { const r = e.currentTarget.closest(".chart").getBoundingClientRect(); setTip({ x: e.clientX - r.left, y: e.clientY - r.top, content }); };
  return [tip, show, () => setTip(null)];
}
const Tip = ({ tip }) => tip ? <div className="tip" style={{ left: tip.x, top: tip.y }}>{tip.content}</div> : null;

function HBars({ rows, max = 100, unit = "%", flagAbove }) {
  return (<div role="list">
    <div className="axis" aria-hidden="true"><div></div><div>{[0,25,50,75,100].map(t => <span key={t}>{Math.round(t * max / 100)}{unit}</span>)}</div></div>
    {rows.map(r => { const pct = Math.max(0, Math.min(100, 100 * (r.v || 0) / max)), flagged = r.flag != null ? r.flag : flagAbove != null && r.v > flagAbove;
      return (<div className="hb" key={r.k} role="listitem" tabIndex="0" title={`${r.k}: ${fmt(r.v)}${unit}`} aria-label={`${r.k}: ${fmt(r.v)}${unit}`}>
        <div className="lab">{r.k}</div>
        <div className="trk"><div className="bar" style={{ width: pct + "%", background: flagged ? "var(--crit)" : "var(--accent)" }}></div>
          <span className="v" style={{ left: pct + "%" }}>{fmt(r.v)}{unit}{flagged ? " ▲" : ""}</span></div></div>); })}
  </div>);
}

function Funnel({ steps }) {
  const max = steps[0].visit_count || 1;
  return (<div role="list">{steps.map((s, i) => { const pct = 100 * s.visit_count / max;
    return (<div className="hb" key={s.label} role="listitem" tabIndex="0" title={`${s.label}: ${s.visit_count.toLocaleString()} (${fmt(pct)}% of start)`}>
      <div className="lab">{s.label}</div>
      <div className="trk"><div className="bar" style={{ width: pct + "%", background: i === steps.length - 1 ? "var(--accent-ink)" : "var(--accent)", opacity: 1 - i * 0.12 }}></div>
        <span className="v" style={{ left: pct + "%" }}>{s.visit_count.toLocaleString()}</span></div></div>); })}</div>);
}

function ClinicBars({ rows, overall, selected }) {
  const max = 80, x = v => Math.max(0, Math.min(100, 100 * v / max));
  const vals = rows.map(r => r.periodontitis_pct), spread = Math.max(...vals) - Math.min(...vals);
  return (<div>
    <div className="axis" aria-hidden="true"><div></div><div>{[0,20,40,60,80].map(t => <span key={t}>{t}%</span>)}</div></div>
    <div role="list">{rows.map(r => { const v = r.periodontitis_pct, dev = Math.abs(v - overall), sel = selected === r.clinic;
      return (<div className={`hb ${sel ? "sel" : ""}`} key={r.clinic} role="listitem" tabIndex="0"
          title={`Clinic ${r.clinic}: ${fmt(v)}% (95% CI ${fmt(r.ci_low_pct)}–${fmt(r.ci_high_pct)}), ${v >= overall ? "+" : "−"}${fmt(dev)} vs overall, ${r.people_count} people`}>
        <div className="lab">{sel ? "▸ " : ""}Clinic {r.clinic}</div>
        <div className="trk"><div className="bar" style={{ width: x(v) + "%", background: dev > 8 ? "var(--series-2)" : "var(--accent)" }}></div>
          <div className="ci" style={{ left: x(r.ci_low_pct) + "%", width: (x(r.ci_high_pct) - x(r.ci_low_pct)) + "%" }}></div>
          <div className="ov" style={{ left: x(overall) + "%" }}></div>
          <span className="v" style={{ left: x(r.ci_high_pct) + "%" }}>{fmt(v)}%</span></div></div>); })}</div>
    <div className="legend" style={{ marginTop:8 }}><span><i className="sw" style={{ background:"var(--accent)" }}></i>Within 8 pts of overall</span><span><i className="sw" style={{ background:"var(--series-2)" }}></i>More than 8 pts from overall</span><span>Dashed line: overall {fmt(overall)}%</span><span>Whiskers: 95% intervals</span><span>Spread {fmt(spread)} pts</span></div>
  </div>);
}

function Matrix({ labels, value, flagBelow }) {
  return (<div className="twrap"><div className="matrix" style={{ gridTemplateColumns: `minmax(90px,auto) repeat(${labels.length}, minmax(56px,1fr))`, minWidth: 90 + labels.length*60 }}>
    <div className="h"></div>{labels.map(l => <div className="h" key={l[0]}>{l[1]}</div>)}
    {labels.map(a => (<React.Fragment key={a[0]}><div className="rh">{a[1]}</div>
      {labels.map(b => { const diag = a[0] === b[0], v = diag ? null : value(a[0], b[0]); const flag = !diag && v != null && v < flagBelow;
        return <div key={b[0]} className={`c ${diag ? "diag" : ""} ${flag ? "flag" : ""}`} title={diag ? "" : `${a[1]} × ${b[1]}: ${fmt(v)}% agree`}
          style={diag || v == null ? {} : { background: seq(v/100), color: v/100 > 0.5 ? "#fff" : "var(--ink)" }}>{diag ? "—" : v == null ? "" : `${Math.round(v)}%`}</div>; })}
    </React.Fragment>))}</div></div>);
}

function TransitionMatrix({ stages, value }) {
  return (<div className="twrap"><div className="matrix" style={{ gridTemplateColumns: `minmax(90px,auto) repeat(${stages.length}, minmax(44px,1fr))`, minWidth: 90 + stages.length*50 }}>
    <div className="h" style={{ justifyContent:"flex-start" }}>visit t ↓ / t+1 →</div>{stages.map(s => <div className="h" key={s[0]}>{s[1]}</div>)}
    {stages.map((a, i) => (<React.Fragment key={a[0]}><div className="rh">{a[1]}</div>
      {stages.map((b, j) => { const r = value(a[0], b[0]), v = r ? r.row_pct : 0, improved = j < i && v > 0;
        return <div key={b[0]} className={`c ${improved ? "flag" : ""}`} title={`${a[1]} → ${b[1]}: ${fmt(v)}% of row, ${r ? r.pair_count : 0} visit pairs`}
          style={{ background: seq(v/100), color: v/100 > 0.5 ? "#fff" : "var(--ink)" }}>{Math.round(v)}%</div>; })}
    </React.Fragment>))}</div>
    <div className="legend" style={{ marginTop:8 }}><span>Row % of visit pairs with that stage at visit t</span><span><i className="sw" style={{ boxShadow:"inset 0 0 0 2px var(--crit)", background:"transparent" }}></i>Below the diagonal = stage improved: a charting or rule error unless treated</span></div></div>);
}

function Tile({ eyebrow, domain, v, unit, def, status, src, info }) {
  const cls = status === "none" ? "" : status;
  return (<div className={`tile ${cls}`}><div className="eyebrow">{eyebrow}<Info k={src}/></div><div className="domain">{domain}<Info k={info}/></div>
    <div className="value">{v == null ? "—" : fmt(v)}<small>{unit}</small></div><div className="def">{def}</div>
    <span className={`pill ${cls}`} style={status === "none" ? { color:"var(--ink-3)", background:"var(--surface-2)" } : {}}>{STATUS_LABEL[status]}</span></div>);
}
function Panel({ eyebrow, title, rung, w, children, note, info, rungInfo }) {
  return (<section className={`panel ${w || ""}`}><div className="phead"><div><div className="eyebrow">{eyebrow}</div><h2>{title}{info && <Info k={info}/>}</h2></div>{rung && <span className="rung">{rung}{rungInfo && <Info k={rungInfo}/>}</span>}</div>
    {note && <p className="note">{note}</p>}{children}</section>);
}
const SectionH = ({ children, src, info }) => <div className="section-h"><h3>{children}{info && <Info k={info}/>}</h3><div className="line"></div>{src && <span className="src">{src}</span>}</div>;

const GROUP_TYPES = [["office","Office"],["provider","Provider"],["sex","Sex"],["race","Race"],["exam_year","Exam year"],["age_band","Age band"]];
const GROUP_METRICS = [["no_margin_chart","No gum-margin readings"],["incomplete_chart","Incomplete in any way"]];
function GroupPanel({ rows }) {
  const [type, setType] = useState("office");
  const [metric, setMetric] = useState("no_margin_chart");
  const sel = rows.filter(r => r.group_type === type && r.metric === metric);
  const label = r => type === "office" ? `Office ${r.group}` : type === "provider" ? `Provider ${r.group}` : r.group;
  const flagged = sel.filter(r => r.is_flagged).length;
  return (<Panel w="w12" eyebrow="Consistency by group · synthetic Open Dental extract" title="Is the perio chart kept as well for every group?" info="groups"
      note={`Share of each group's perio charts. ${flagged ? flagged + " flagged ▲ against the rest of its type." : "No group is flagged: on synthetic data every group is charted alike, as the generator makes it."}`}>
    <div className="clinics" role="group" aria-label="Group by" style={{ marginBottom: 8 }}><span className="lbl">Group by</span>
      {GROUP_TYPES.map(([id, l]) => <button key={id} type="button" aria-pressed={type === id} onClick={() => setType(id)}>{l}</button>)}</div>
    <div className="scope" role="group" aria-label="Measure" style={{ marginBottom: 12 }}>
      {GROUP_METRICS.map(([id, l]) => <button key={id} aria-pressed={metric === id} onClick={() => setMetric(id)}>{l}</button>)}</div>
    <HBars rows={sel.map(r => ({ k: `${label(r)} (${r.chart_count.toLocaleString()})`, v: r.pct, flag: r.is_flagged }))}/>
  </Panel>);
}
function ChecksPanel({ rows }) {
  const DOMAIN = { completeness: "Completeness", accuracy: "Accuracy", plan_copy: "Plan copies", list_in_use: "List in use", consistency: "Consistency" };
  return (<Panel w="w12" eyebrow="After Kookal et al. 2024 · synthetic Open Dental extract" title="Extract checks" info="checks"
      note="Found = rows, cells or offices the check found. Flagged when anything is found; the missing-value share is reported, not flagged.">
    <div className="twrap"><table><thead><tr><th>Check</th><th className="num">Found</th><th>Status</th></tr></thead>
      <tbody>{rows.map(r => <tr key={r.check}><td className="k"><span style={{ display:"block", fontSize:11, color:"var(--ink-3)", textTransform:"uppercase", letterSpacing:"0.06em" }}>{DOMAIN[r.domain] || r.domain}</span>{r.text}</td>
        <td className="num" title={`${fmt(r.found_pct, 2)}% of ${r.checked_count.toLocaleString()} checked`}>{r.found_count.toLocaleString()}<span style={{ display:"block", fontSize:11, color:"var(--ink-3)" }}>of {r.checked_count.toLocaleString()}</span></td>
        <td>{r.is_flagged == null ? <span className="pill" style={{ color:"var(--ink-3)", background:"var(--surface-2)", marginTop:0 }}>Reported</span>
          : r.is_flagged ? <span className="pill warn" style={{ marginTop:0 }}>Found</span> : <span className="pill good" style={{ marginTop:0 }}>None found</span>}</td></tr>)}</tbody></table></div>
  </Panel>);
}

  const people = S.prevalence_clinic.reduce((a, r) => a + r.people_count, 0);
  const overall = S.prevalence_clinic.reduce((a, r) => a + r.periodontitis_pct * r.people_count, 0) / people;
  const T = S.tiles;
  const src = []; S.concordance.forEach(r => [[r.method_a, r.label_a], [r.method_b, r.label_b]].forEach(x => { if (!src.some(y => y[0] === x[0])) src.push(x); }));
  const conc = (a, b) => { const r = S.concordance.find(x => (x.method_a === a && x.method_b === b) || (x.method_a === b && x.method_b === a)); return r ? r.agree_pct : null; };
  const order = ["healthy_gingivitis","periodontitis_stage_1","periodontitis_stage_2","periodontitis_stage_3","periodontitis_stage_4"];
  const stages = order.map(s => [s, (S.transitions.find(r => r.from_status === s) || {}).from_label || s]);
  const trans = (a, b) => S.transitions.find(r => r.from_status === a && r.to_status === b);
  const design = ["exam_form","proc_dx_completed","proc_dx_planned","notes","probing_chart"];
  const cascade = design.map((c, i) => ({ n: i+1, row: m.truth.find(r => r.source === c) }));
  return (<>
    <a className="home" href="/"><b>H</b>← Back to home</a>

      <div className="meta"><span className="chip sample">Synthetic data · not clinical performance</span><span className="chip">{T.visit_count.toLocaleString()} visits</span><span className="chip">{T.clinic_count} clinics</span><span className="chip">Open Dental-shaped</span></div></header>
    <div className="rail" role="toolbar" aria-label="Filters">
      <div className="clinics" role="group" aria-label="Clinic"><span className="lbl">Clinic</span>

      <div className="scope" role="group" aria-label="Level of scale">{SCOPES.map(s => <button key={s.id} aria-pressed={scope === s.id} onClick={() => setScope(s.id)}>{s.label}</button>)}</div><Info k="scope"/>
      <span className="field">{m.visit_count.toLocaleString()} visits in view</span>
    </div>
    <div className="tiles">
      <Tile eyebrow="Zozus" src="zozus" info="completeness" domain="Completeness" v={m.completeness_pct} unit="% complete" def="Visits with exam form, diagnosis code and gum chart all present" status={band(m.completeness_pct, 80, 25, true)}/>
      <Tile eyebrow="Zozus" src="zozus" info="accuracy" domain="Accuracy" v={m.accuracy_pct} unit="% vs truth" def="Rules on the whole record, measurements first, against the synthetic truth" status={band(m.accuracy_pct, 85, 70, true)}/>
      <Tile eyebrow="Zozus" src="zozus" info="consistency" domain="Consistency" v={T.consistency_pts} unit="pt spread" def={`Periodontitis prevalence range across the ${T.clinic_count} clinics`} status={band(T.consistency_pts, 10, 20, false)}/>
      <Tile eyebrow="Kahn" src="kahn" info="temporal" domain="Temporal plausibility" v={T.implausible_pct} unit="% implausible" def="Visit pairs whose stage improved without treatment" status={band(T.implausible_pct, 5, 10, false)}/>
      <Tile eyebrow="de Vet" src="devet" info="reliability" domain="Reliability" v={null} unit="" def="Needs real reviewers staging the same records" status="none"/>
    </div>
    <div className="grid">
      <SectionH src={`${clinic === "All" ? "All clinics" : "Clinic " + clinic} · ${SCOPES.find(s => s.id === scope).label}`} info="completeness">Completeness</SectionH>
      <Panel w="w8" eyebrow="Column data value completeness" title="Missingness by source" note="Share of visits where the source gives no status. Sources above 30% are flagged ▲.">
        <HBars rows={m.missing.map(r => ({ k: r.label, v: r.missing_pct }))} flagAbove={30}/></Panel>
      <Panel w="w4" eyebrow="Column completeness, every column" title="Missing by evidence column" note="All visits, all clinics, including the chart measurements.">
        <div className="twrap"><table><thead><tr><th>Column</th><th className="num">Missing</th></tr></thead>
          <tbody>{S.missingness.map(r => <tr key={r.column}><td className="k">{r.label}</td><td className="num">{fmt(r.missing_pct)}%</td></tr>)}</tbody></table></div></Panel>
      <Panel w="w12" eyebrow="Row data value completeness" title="Complete-case funnel" info="funnel" note="Visits surviving each requirement. The last bar is the number of visits where every source can be compared.">

            <td className="num">{fmt(r.sensitivity_pct)}</td><td className="num">{fmt(r.specificity_pct)}</td><td className="num">{fmt(r.ppv_pct)}</td><td className="num">{fmt(r.npv_pct)}</td></tr>)}</tbody></table></div></Panel>
      <Panel w="w6" eyebrow="Comparison to independent measurement" title="Concordance between sources" rung="Hierarchy · rung 2" rungInfo="rung2" info="concordance"

        <Matrix labels={src} value={conc} flagBelow={65}/>
        <div className="legend"><span>Agreement <span className="ramp">{[1,2,3,4,5,6,7].map(i => <i key={i} style={{ background: `var(--seq-${i*100})` }}></i>)}</span> 0 → 100%</span></div></Panel>
      <SectionH src="Stratified by clinic" info="consistency">Consistency</SectionH>
      <Panel w="w8" eyebrow="Site consistency" title="Periodontitis prevalence by clinic" note="Rules, exam form first, per person. Differences aren't errors by themselves; large gaps are worth a look as population, protocol or documentation effects. The scale filter doesn't apply here.">
        <ClinicBars rows={S.prevalence_clinic} overall={overall} selected={clinic}/></Panel>
      <Panel w="w4" eyebrow="Levels of scale" title="Prevalence by scale" info="scope" note="Periodontitis share on each scale, by method.">
        <div className="twrap"><table><thead><tr><th>Method</th><th>Scale</th><th className="num">Perio</th></tr></thead>
          <tbody>{S.prevalence_scale.filter(r => ["algorithm_design","notes","probing_chart"].includes(r.method)).map(r => <tr key={r.method + r.scale}><td className="k">{r.label}</td><td>{r.scale.replace(/_/g, " ")}</td><td className="num">{fmt(r.periodontitis_pct)}%</td></tr>)}</tbody></table></div></Panel>
      <SectionH src="Borrowed from Kahn et al. · de Vet et al.">Concepts from other frameworks</SectionH>
      <Panel w="w6" eyebrow="Patient-level consistency · temporal plausibility" title="Stage at one visit and the next" rung="Kahn · temporal" rungInfo="temporal"
             note="Rules, exam form first. Without treatment a stage should hold or worsen; movement below the diagonal is implausible.">
        <TransitionMatrix stages={stages} value={trans}/>
        <p className="note">Injected charting errors (synthetic only): {S.injected.injected_count} added on purpose; the temporal checks catch {S.injected.caught_count} ({fmt(S.injected.caught_pct)}%) and flag {fmt(S.injected.false_flag_pct, 2)}% of visits with none.</p></Panel>
      <Panel w="w6" eyebrow="Temporal plausibility by method" title="Implausible change, per source" rung="Kahn · temporal" note="Visit pairs 1–2 years apart with no treatment between. Lower improved and resolved shares are more plausible.">
        <div className="twrap"><table><thead><tr><th>Method</th><th className="num">Pairs</th><th className="num">Improved</th><th className="num">Resolved</th><th className="num">Stage drop</th></tr></thead>
          <tbody>{S.temporal.map(r => <tr key={r.method}><td className="k">{r.label}</td><td className="num">{r.pair_count.toLocaleString()}</td><td className="num">{fmt(r.improved_pct)}%</td><td className="num">{fmt(r.resolved_pct)}%</td><td className="num">{fmt(r.stage_drop_pct)}%</td></tr>)}</tbody></table></div></Panel>
      <Panel w="w12" eyebrow="Reliability" title="Not assessed" rung="de Vet · reliability" rungInfo="reliability">
        <p className="note">Reliability needs real reviewers staging the same records, and their agreement with each other (<a href="../scoring/">how scoring works</a>). Simulated reviewers are a dry run and aren't shown.</p></Panel>
      <SectionH src="Pragmatic-trials framework">Impact assessment</SectionH>
      <Panel w="w12" eyebrow="Rule-based cascade" title="The study design's source order vs. observed accuracy" rung="Impact assessment" rungInfo="impact"
             note="The design draws from each source in order until a status is found. Where a later source agrees with the truth more often than the one before it, the order is worth revisiting.">
        <div className="cascade">{cascade.map((c, i) => { const prev = cascade[i-1]; const reorder = prev && c.row.agree_pct > prev.row.agree_pct;
          return (<div key={c.n} className={`step ${reorder ? "reorder" : ""}`}><span className="n">{String(c.n).padStart(2, "0")}</span>
            <span><span className="t">{c.row.label}</span><br/><span className="d">{c.row.answered_count.toLocaleString()} visits with a status</span></span>
            <span className="acc">{fmt(c.row.agree_pct)}% vs truth</span>
            {reorder ? <span className="pill warn" style={{ marginTop:0 }}>Outranks step {prev.n}</span> : <span className="pill good" style={{ marginTop:0 }}>Order holds</span>}</div>); })}</div></Panel>
      <SectionH src="Spec 029, the tooth-loss work">How messy the perio charts are</SectionH>
      <Panel w="w12" eyebrow="Synthetic Open Dental extract · 2,000 patients" title="Chart messiness, measured the way a real extract would be" info="messiness" note="Counts only. Real rates come from running the same profile on a real extract.">
        <HBars rows={S.open_dental.map(r => ({ k: r.label, v: r.pct }))}/></Panel>
      {S.chart_by_group && <GroupPanel rows={S.chart_by_group}/>}
      {S.extract_checks && <ChecksPanel rows={S.extract_checks}/>}
    </div>
    <p className="foot">Every number is computed from the project's committed synthetic data, by the same tables as its Databricks dashboard (<a href={CODE}>dq_site.py</a>; <a href={SRC}>data</a>). Status thresholds (completeness 80%/25%, accuracy 85%/70%, spread 10/20 points, implausible 5%/10%, missingness 30%, concordance 65%, 8-point clinic gap) are starting points to agree with a research team. Personal learning project, not affiliated with any employer or organization; the patients are synthetic. Hover any bar or cell for its value.</p>
    <a className="home" href="/" style={{ marginTop:16 }}><b>H</b>← Back to home</a>
  </>);
}

function Root() {
  const [d, setD] = useState(null), [err, setErr] = useState(false);
  useEffect(() => { fetch(SRC).then(r => r.json()).then(setD).catch(() => setErr(true)); }, []);
  if (err) return <p className="loading">The data could not be loaded. Open it directly: <a href={SRC}>{SRC}</a></p>;
  if (!d) return <p className="loading">Loading the data…</p>;
  return <App d={d}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
